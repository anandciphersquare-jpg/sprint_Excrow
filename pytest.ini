[pytest]
# Make the project root importable so `from config...`, `from core...`,
# `from admin...`, `from partner...` resolve when running `pytest` anywhere.
pythonpath = .

testpaths = admin/tests partner/tests partner_ops/tests trustee/tests

addopts =
    -v
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    # Hard ceiling per test so a hung UAT fails instead of blocking the run
    # indefinitely. Longest measured test is ~80s; a full create is ~120s, so
    # 300s is a genuine-hang detector, not a tight budget.
    --timeout=300
    --timeout-method=thread
    # Surface the slow tail - this suite re-logs-in and re-drives the wizard
    # for every test, and that cost is otherwise invisible.
    --durations=20

# Not set here on purpose: --maxfail. Pass it per run instead, so a full
# regression pass is not cut short but a record-creating run can be capped:
#   pytest -m "admin and not create" --maxfail=10
#   pytest -m "admin and create"     --maxfail=3    # stop after 3 wasted records

markers =
    smoke: fast confidence checks (login, navigation)
    regression: full functional coverage
    e2e: cross-portal end-to-end (admin creates -> partner verifies)
    admin: Super Admin portal suite
    partner: Partner portal suite
    partner_ops: Partner portal operations suite (beneficiary, payout, VID,
        wallet reconciliation). Financial tests that move money are additionally
        marked `create` and gated on PARTNER_OPS_SPEND / PARTNER_OPS_CREATE_DATA.
    trustee: Trustee portal suite (future)
    negative: negative / validation / error-handling scenarios
    onboarding: new-partner chain (welcome email -> first login -> forced
        password change -> re-login). Re-asserts what
        `scripts/run_onboarding_e2e.py` recorded, and skips with a pointer to
        that script when no run exists - the flow burns a real temporary
        password, so it cannot be a per-test fixture.
    create: submits the wizard and leaves a real escrow record behind in UAT
    security: basic security checks (masking, XSS/SQLi input handling, session)
